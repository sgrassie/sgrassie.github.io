# Site setings
name: 'Stuart Grassie: TemporalCohesion'
title: 'Stuart Grassie: TemporalCohesion'
tagline: "A blog about software development"
description: 'A blog about software development, by Stuart Grassie'
meta_description: 'A blog about software development'
logo:
# Author image is used in site sidebar and greetings in the home page hero text
author:
  twitter: stugrassie
  image: 'me-avatar.webp'
  greetings: "I'm Stuart Grassie, a software developer in North West England. Notes and practical guides on .NET, C#, F#, Neovim, and self-hosted homelab tooling."
favicon: 'assets/images/favicon.ico'
url: https://temporalcohesion.co.uk
baseurl: 
production_url: https://temporalcohesion.co.uk
locale: en_GB
disqus: 'temporalcohesion'
mailchimp_url: 
# Add your GA4 Tracking Id if needed (Universal Analytics UA-* was sunset in July 2023)
ga_analytics: 

# Contact form setings
email: sgrassie@gmail.com
contact_page_description: 
thankyou_page_description: "Your message has been sent. I'll get back to you soon."

# Social links
twitter: 
   username: 'stugrassie'
   card: summary_large_image
facebook: 'sgrassie'
github: 'sgrassie'
codepen: 
dribbble: 
medium: 
instagram: 
pinterest: 
linkedin: 'sgrassie'
producthunt: 
quora:
mastodon: 'grassie' 

social:
  name: Stuart Grassie
  links:
    - https://twitter.com/stugrassie
    - https://www.facebook.com/sgrassie
    - https://www.linkedin.com/in/sgrassie
    - https://github.com/sgrassie

# Navigation (Search lives in the header actions bar with "/" shortcut)
navigation:
  - text: Home
    url: /
  - text: Archive
    url: /archives
  - text: Tags
    url: /tags/
  - text: About
    url: /about
  - text: Contact
    url: /contact

# Required Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-gist

# Pagination
paginate: 10
paginate_path: /page:num/

# Permalinks
permalink: /:year/:month/:day/:title

# Other
markdown: kramdown
highlighter: rouge

# Keep repo tooling and working files out of the built site
exclude:
  - script
  - README.md
  - Changelog.md
  - headerimagetemplate
  - tool.config
  - contact.original
  - style-guide.md

# Sass
sass:
  sass_dir: _sass
  style: compressed
